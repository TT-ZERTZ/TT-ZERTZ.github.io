<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Toolbox</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --text: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--primary);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        /* Main Page Buttons */
        .btn {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-large {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: #03dac6;
        }
        
        /* Old Scripts Grid */
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .old-script-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
            cursor: pointer;
        }
        .old-script-card:hover {
            border-color: var(--primary);
        }

        /* Full Page Community GUI (Hidden by default) */
        #communityGui {
            display: none; /* Hidden on load */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 1000;
            overflow-y: auto; /* Allow scrolling inside the GUI */
            padding: 30px 20px;
            box-sizing: border-box;
        }

        /* Form and Card Styles for Community GUI */
        .upload-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .community-container {
            max-width: 800px;
            margin: 0 auto;
        }
        input, textarea {
            width: 100%;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
        }
        .script-card {
            background-color: var(--card-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #03dac6;
        }
        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .script-header h3 {
            margin: 0;
            color: #fff;
            border: none;
        }
        .code-block {
            background-color: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 15px 0;
        }
        .upvote-btn {
            background-color: transparent;
            border: 1px solid #03dac6;
            color: #03dac6;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .upvote-btn:hover {
            background-color: #03dac6;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- ================= MAIN PAGE (OLD SCRIPTS) ================= -->
    <div class="container" id="mainPage">
        <h1>JS Toolbox</h1>
        
        <!-- Button to open the full-page GUI -->
        <button class="btn btn-large" onclick="openCommunityGui()">🌐 Open Community Scripts & Upload</button>

        <h2>Built-in Scripts & Hacks</h2>
        <div class="scripts-grid">
            <!-- Placeholder cards based on your zip file contents -->
            <div class="old-script-card">AutoClicker</div>
            <div class="old-script-card">Spotify No Ads</div>
            <div class="old-script-card">BetterTube</div>
            <div class="old-script-card">Blooket GUI</div>
            <div class="old-script-card">Universal AI</div>
            <div class="old-script-card">Maths Pathways</div>
            <div class="old-script-card">History Flooder</div>
            <div class="old-script-card">SpoofGUI</div>
        </div>
    </div>


    <!-- ================= FULL PAGE GUI (COMMUNITY UPLOADS) ================= -->
    <div id="communityGui">
        <div class="community-container">
            <button class="btn" onclick="closeCommunityGui()">← Back to Main Menu</button>
            
            <h1>Community Scripts</h1>

            <div class="upload-section">
                <h2>Upload a Script</h2>
                <form id="uploadForm">
                    <label for="scriptName">Script Name:</label>
                    <input type="text" id="scriptName" placeholder="e.g., Custom Theme Hack" required>
                    
                    <label for="scriptCode">JavaScript Code:</label>
                    <textarea id="scriptCode" rows="6" placeholder="Paste your code here..." required></textarea>
                    
                    <button class="btn" type="submit">Publish Script</button>
                </form>
            </div>

            <h2>Trending Scripts</h2>
            <div id="scriptList">
                <!-- Scripts will be injected here by JavaScript -->
            </div>
        </div>
    </div>


    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // --- GUI Toggle Functions ---
        function openCommunityGui() {
            document.getElementById('communityGui').style.display = 'block';
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        }

        function closeCommunityGui() {
            document.getElementById('communityGui').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restore background scrolling
        }

        // --- Community Script Logic ---
        let scripts = JSON.parse(localStorage.getItem('toolbox_scripts')) || [];

        function renderScripts() {
            const container = document.getElementById('scriptList');
            container.innerHTML = ''; 

            // Sort scripts by popularity
            scripts.sort((a, b) => b.popularity - a.popularity);

            if (scripts.length === 0) {
                container.innerHTML = '<p style="color:#888;">No scripts uploaded yet. Be the first!</p>';
                return;
            }

            scripts.forEach((script, index) => {
                const card = document.createElement('div');
                card.className = 'script-card';

                const header = document.createElement('div');
                header.className = 'script-header';
                
                const title = document.createElement('h3');
                title.textContent = script.name; 

                const upvoteBtn = document.createElement('button');
                upvoteBtn.className = 'upvote-btn';
                upvoteBtn.innerHTML = `🔥 Upvote (${script.popularity})`;
                
                upvoteBtn.onclick = () => {
                    scripts[index].popularity += 1;
                    saveAndRender();
                };

                const codeBlock = document.createElement('div');
                codeBlock.className = 'code-block';
                codeBlock.textContent = script.code;

                header.appendChild(title);
                header.appendChild(upvoteBtn);
                card.appendChild(header);
                card.appendChild(codeBlock);
                container.appendChild(card);
            });
        }

        function saveAndRender() {
            localStorage.setItem('toolbox_scripts', JSON.stringify(scripts));
            renderScripts();
        }

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('scriptName').value.trim();
            const codeInput = document.getElementById('scriptCode').value.trim();

            if (nameInput && codeInput) {
                scripts.push({
                    name: nameInput,
                    code: codeInput,
                    popularity: 0 
                });
                
                saveAndRender();
                this.reset(); 
            }
        });

        // Initial render for community scripts
        renderScripts();
    </script>
</body>
</html>
