<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Toolbox - Community Scripts</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --text: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            color: var(--primary);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .upload-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, textarea {
            width: 100%;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .script-card {
            background-color: var(--card-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .script-header h3 {
            margin: 0;
            color: #fff;
        }
        .code-block {
            background-color: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 15px 0;
        }
        .upvote-btn {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .upvote-btn:hover {
            background-color: var(--primary);
            color: #000;
        }
    </style>
</head>
<body>

    <h1>JS Toolbox</h1>

    <div class="upload-section">
        <h2>Upload a Script</h2>
        <form id="uploadForm">
            <label for="scriptName">Script Name:</label>
            <input type="text" id="scriptName" placeholder="e.g., AutoClicker v2" required>
            
            <label for="scriptCode">JavaScript Code:</label>
            <textarea id="scriptCode" rows="6" placeholder="Paste your code here..." required></textarea>
            
            <button type="submit">Publish Script</button>
        </form>
    </div>

    <h2>Community Scripts</h2>
    <div id="scriptList">
        <!-- Scripts will be injected here by JavaScript -->
    </div>

    <script>
        // Load scripts from Local Storage or start with an empty array
        let scripts = JSON.parse(localStorage.getItem('toolbox_scripts')) || [];

        // Function to render scripts to the screen
        function renderScripts() {
            const container = document.getElementById('scriptList');
            container.innerHTML = ''; // Clear current list

            // Sort scripts by popularity (highest first)
            scripts.sort((a, b) => b.popularity - a.popularity);

            if (scripts.length === 0) {
                container.innerHTML = '<p style="color:#888;">No scripts uploaded yet. Be the first!</p>';
                return;
            }

            // Create HTML elements for each script securely
            scripts.forEach((script, index) => {
                const card = document.createElement('div');
                card.className = 'script-card';

                const header = document.createElement('div');
                header.className = 'script-header';
                
                const title = document.createElement('h3');
                title.textContent = script.name; // textContent prevents XSS injection

                const upvoteBtn = document.createElement('button');
                upvoteBtn.className = 'upvote-btn';
                upvoteBtn.innerHTML = `🔥 Upvote (${script.popularity})`;
                
                // Popularity Upvote Logic
                upvoteBtn.onclick = () => {
                    scripts[index].popularity += 1;
                    saveAndRender();
                };

                const codeBlock = document.createElement('div');
                codeBlock.className = 'code-block';
                codeBlock.textContent = script.code;

                header.appendChild(title);
                header.appendChild(upvoteBtn);
                card.appendChild(header);
                card.appendChild(codeBlock);
                container.appendChild(card);
            });
        }

        // Save to storage and refresh UI
        function saveAndRender() {
            localStorage.setItem('toolbox_scripts', JSON.stringify(scripts));
            renderScripts();
        }

        // Handle new script submissions
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('scriptName').value.trim();
            const codeInput = document.getElementById('scriptCode').value.trim();

            if (nameInput && codeInput) {
                // Add new script object to the array
                scripts.push({
                    name: nameInput,
                    code: codeInput,
                    popularity: 0 // Starts with 0 upvotes
                });
                
                saveAndRender();
                this.reset(); // Clear the form
            }
        });

        // Initial render on page load
        renderScripts();
    </script>
</body>
</html>
